name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Best-effort signing. If APPLE_CERTIFICATE_P12 is absent, we ship an
      # ad-hoc-signed DMG (script's fallback) and skip notarization. When
      # secrets are present, the chain produces a Developer ID signed +
      # notarized + stapled DMG exactly as before.
      - name: Check signing secrets
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          have_cert="false"; have_notary="false"; have_sparkle="false"
          [[ -n "$CERT" ]] && have_cert="true"
          [[ -n "$APPLE_ID" ]] && have_notary="true"
          [[ -n "$SPARKLE_KEY" ]] && have_sparkle="true"
          {
            echo "have_cert=$have_cert"
            echo "have_notary=$have_notary"
            echo "have_sparkle=$have_sparkle"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Signing capability — cert:$have_cert notary:$have_notary sparkle:$have_sparkle"

      - name: Install dependencies
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      - name: Import signing certificate
        if: steps.signing.outputs.have_cert == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HAVE_NOTARY: ${{ steps.signing.outputs.have_notary }}
        run: |
          set -euo pipefail

          CERT_FILE="$(mktemp).p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_FILE" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          if [[ "$HAVE_NOTARY" == "true" ]]; then
            xcrun notarytool store-credentials "atoll-notary" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --keychain "$KEYCHAIN_PATH"
          fi

          rm -f "$CERT_FILE"

      - name: Build and package
        env:
          ATOLL_APP_NAME: "Atoll"
          ATOLL_VERSION: ${{ steps.version.outputs.version }}
          ATOLL_BUILD_NUMBER: ${{ github.run_number }}
          ATOLL_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ATOLL_UNIVERSAL: "true"
        run: zsh scripts/package-app.sh

      - name: Verify artifacts
        run: |
          test -f "output/package/Atoll.zip"
          test -f "output/package/Atoll.dmg"
          ls -lh output/package/

      - name: Verify code signature
        if: steps.signing.outputs.have_cert == 'true'
        run: |
          bundle="output/package/Atoll.app"
          echo "--- Signature info ---"
          codesign -dvv "$bundle"
          echo ""
          echo "--- Signature verification ---"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Verify bundle structure
        run: |
          bundle="output/package/Atoll.app"
          echo "--- Bundle contents ---"
          find "$bundle" -maxdepth 3 -type f | sort

          for f in \
            "Contents/MacOS/AtollApp" \
            "Contents/Helpers/AtollHooks" \
            "Contents/Helpers/AtollSetup" \
          ; do
            if [[ ! -e "$bundle/$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "Bundle structure OK"

      - name: Notarize (best-effort)
        if: steps.signing.outputs.have_notary == 'true' && vars.SKIP_NOTARIZE != 'true'
        id: notarize
        continue-on-error: true
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bundle="output/package/Atoll.app"
          zip_path="output/package/Atoll.zip"
          dmg_path="output/package/Atoll.dmg"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$zip_path" \
            --keychain-profile "atoll-notary" \
            --wait --timeout 10m || { echo "::warning::Notarization failed or timed out"; exit 1; }

          echo "Stapling app bundle..."
          xcrun stapler staple -v "$bundle"

          rm -f "$zip_path"
          ditto -c -k --keepParent "$bundle" "$zip_path"

          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile "atoll-notary" \
            --wait --timeout 10m || { echo "::warning::DMG notarization failed or timed out"; exit 1; }
          xcrun stapler staple -v "$dmg_path"

          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Sign update with EdDSA (Sparkle)
        if: steps.signing.outputs.have_sparkle == 'true'
        id: sparkle_sign
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          sign_tool=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          zip_path="output/package/Atoll.zip"

          sign_output="$(printf '%s' "$SPARKLE_EDDSA_KEY" | "$sign_tool" "$zip_path" --ed-key-file -)"
          ed_signature="$(echo "$sign_output" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          length="$(echo "$sign_output" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          {
            echo "ed_signature=$ed_signature"
            echo "length=$length"
            echo "signed=true"
          } >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ed_signature (length: $length)"

      - name: Update appcast.xml
        if: steps.sparkle_sign.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ED_SIG: ${{ steps.sparkle_sign.outputs.ed_signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          zsh scripts/update-appcast.sh "$VERSION" "$BUILD_NUMBER" "$ED_SIG" "$LENGTH"
          cat appcast.xml

      - name: Update appcast.xml via PR
        if: steps.sparkle_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/appcast-v${VERSION}"
          cp appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "chore: update appcast.xml for v${VERSION} [skip release]"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update appcast.xml for v${VERSION} [skip release]" \
            --body "Automated appcast.xml update from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          gh release create "$REF_NAME" \
            --title "Atoll $REF_NAME" \
            --generate-notes \
            --notes-start-tag "$prev_tag" \
            --draft \
            "output/package/Atoll.dmg#Atoll.dmg (macOS, Universal)" \
            "output/package/Atoll.zip#Atoll.zip (macOS, Universal)"

      - name: Append install instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          HAVE_CERT: ${{ steps.signing.outputs.have_cert }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$REF_NAME" --json body -q .body)"
          if [[ "$NOTARIZED" == "true" ]]; then
            install_note="> This build is signed and notarized by Apple. It will launch without Gatekeeper warnings."
          elif [[ "$HAVE_CERT" == "true" ]]; then
            install_note="> This build is signed with a Developer ID certificate. On first launch, right-click → **Open** to bypass Gatekeeper."
          else
            install_note="> This build is **unsigned**. On first launch, right-click → **Open**, then confirm in System Settings → Privacy & Security to bypass Gatekeeper."
          fi
          gh release edit "$REF_NAME" --notes "$(cat <<EOF
          ${existing}

          ---

          ## Installation

          1. Download **Atoll.dmg**, open it, and drag **Atoll** to **Applications**.
          2. Requires **macOS 14+** (Apple Silicon and Intel).

          ${install_note}
          EOF
          )"

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.have_cert == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
