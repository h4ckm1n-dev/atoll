name: Release

# Dual trigger:
#  - push of a v* tag (covers human tag pushes from a workstation)
#  - workflow_run completion of Auto-tag with conclusion=success (covers
#    bot-pushed tags from auto-tag.yml, which the default GITHUB_TOKEN
#    cannot chain into a tag-push event by design).
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Auto-tag"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Prevent concurrent runs against the same resolved tag — two release.yml
# runs racing on the same v1.x.y would double-publish the GitHub release.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-26
    # workflow_run fires on every Auto-tag completion (success / failure /
    # cancelled). We only want to release when Auto-tag actually pushed a tag,
    # which corresponds to conclusion=success. Push-triggered runs pass through.
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      # When workflow_run-triggered, the default checkout ref is the default
      # branch. We instead check out the SHA that Auto-tag tagged.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Fetch all tags
        run: git fetch --tags --force

      # Tag resolution:
      #  - push event on a tag: github.ref_name is the tag (e.g. "v1.4.0").
      #  - workflow_run event: find the v* tag pointing at the head_sha that
      #    Auto-tag just published. There should be exactly one in normal
      #    operation; if there are zero, Auto-tag must have failed to push
      #    (defensive fallback to "no tag, skip release").
      - name: Resolve tag and version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          else
            tag="$(git tag --points-at "$WF_HEAD_SHA" --list 'v[0-9]*' | sort -V | tail -1)"
          fi

          if [[ -z "$tag" ]]; then
            echo "::warning::No v* tag found — exiting cleanly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${tag#v}"
          build_number="$(git rev-list --count HEAD)"
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "version=$version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved release target tag=$tag version=$version build=$build_number"

      # Idempotency. If release.yml already published (or drafted) this tag
      # — possibly because a human re-pushed the tag after Auto-tag, or
      # workflow_run + push fire on overlapping events — skip without error.
      - name: Skip if release already exists
        id: existing
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Below this point: every step gates on both skip flags being false.
      # We define a single composite skip output for readability.
      - name: Compute do_build
        id: gate
        run: |
          set -euo pipefail
          if [[ "${{ steps.resolve.outputs.skip }}" == "true" ]] \
             || [[ "${{ steps.existing.outputs.skip }}" == "true" ]]; then
            echo "do_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "do_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.gate.outputs.do_build == 'true'
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          have_cert="false"; have_notary="false"; have_sparkle="false"
          [[ -n "$CERT" ]] && have_cert="true"
          [[ -n "$APPLE_ID" ]] && have_notary="true"
          [[ -n "$SPARKLE_KEY" ]] && have_sparkle="true"
          {
            echo "have_cert=$have_cert"
            echo "have_notary=$have_notary"
            echo "have_sparkle=$have_sparkle"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Signing capability — cert:$have_cert notary:$have_notary sparkle:$have_sparkle"
          if [[ "$have_sparkle" != "true" ]]; then
            echo "::error::SPARKLE_EDDSA_KEY is required. Without it, Sparkle cannot verify the update zip and appcast.xml is not updated."
            exit 1
          fi

      - name: Install dependencies
        if: steps.gate.outputs.do_build == 'true'
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      - name: Import signing certificate
        if: steps.gate.outputs.do_build == 'true' && steps.signing.outputs.have_cert == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HAVE_NOTARY: ${{ steps.signing.outputs.have_notary }}
        run: |
          set -euo pipefail
          CERT_FILE="$(mktemp).p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_FILE" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          if [[ "$HAVE_NOTARY" == "true" ]]; then
            xcrun notarytool store-credentials "atoll-notary" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --keychain "$KEYCHAIN_PATH"
          fi

          rm -f "$CERT_FILE"

      - name: Build and package
        if: steps.gate.outputs.do_build == 'true'
        env:
          ATOLL_APP_NAME: "Atoll"
          ATOLL_VERSION: ${{ steps.resolve.outputs.version }}
          # Sparkle compares CFBundleVersion, not just the marketing version.
          # Keep builds monotonic across the Open Island -> Atoll release line;
          # workflow run numbers restarted at 1 and made v1.5.0 look older than
          # the legacy v1.0.28 feed item whose build is 65.
          ATOLL_BUILD_NUMBER: ${{ steps.resolve.outputs.build_number }}
          # Only pass the identity string when we actually imported the cert,
          # otherwise codesign tries to sign with an identity that isn't in the
          # runner keychain and fails with "no identity found". When empty, the
          # script falls back to ad-hoc signing.
          ATOLL_SIGN_IDENTITY: ${{ steps.signing.outputs.have_cert == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          ATOLL_UNIVERSAL: "true"
        run: zsh scripts/package-app.sh

      - name: Verify artifacts
        if: steps.gate.outputs.do_build == 'true'
        run: |
          test -f "output/package/Atoll.zip"
          test -f "output/package/Atoll.dmg"
          ls -lh output/package/

      - name: Verify code signature
        if: steps.gate.outputs.do_build == 'true' && steps.signing.outputs.have_cert == 'true'
        run: |
          bundle="output/package/Atoll.app"
          echo "--- Signature info ---"
          codesign -dvv "$bundle"
          echo ""
          echo "--- Signature verification ---"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Verify bundle structure
        if: steps.gate.outputs.do_build == 'true'
        run: |
          bundle="output/package/Atoll.app"
          echo "--- Bundle contents ---"
          find "$bundle" -maxdepth 3 -type f | sort

          for f in \
            "Contents/MacOS/AtollApp" \
            "Contents/Helpers/AtollHooks" \
            "Contents/Helpers/AtollSetup" \
          ; do
            if [[ ! -e "$bundle/$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "Bundle structure OK"

      - name: Notarize (best-effort)
        if: steps.gate.outputs.do_build == 'true' && steps.signing.outputs.have_notary == 'true' && vars.SKIP_NOTARIZE != 'true'
        id: notarize
        continue-on-error: true
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bundle="output/package/Atoll.app"
          zip_path="output/package/Atoll.zip"
          dmg_path="output/package/Atoll.dmg"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$zip_path" \
            --keychain-profile "atoll-notary" \
            --wait --timeout 10m || { echo "::warning::Notarization failed or timed out"; exit 1; }

          echo "Stapling app bundle..."
          xcrun stapler staple -v "$bundle"

          rm -f "$zip_path"
          ditto -c -k --keepParent "$bundle" "$zip_path"

          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile "atoll-notary" \
            --wait --timeout 10m || { echo "::warning::DMG notarization failed or timed out"; exit 1; }
          xcrun stapler staple -v "$dmg_path"

          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Sign update with EdDSA (Sparkle)
        if: steps.gate.outputs.do_build == 'true' && steps.signing.outputs.have_sparkle == 'true'
        id: sparkle_sign
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          sign_tool=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          zip_path="output/package/Atoll.zip"

          sign_output="$(printf '%s' "$SPARKLE_EDDSA_KEY" | "$sign_tool" "$zip_path" --ed-key-file -)"
          ed_signature="$(echo "$sign_output" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          length="$(echo "$sign_output" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          {
            echo "ed_signature=$ed_signature"
            echo "length=$length"
            echo "signed=true"
          } >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ed_signature (length: $length)"

      - name: Update appcast.xml
        if: steps.sparkle_sign.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          BUILD_NUMBER: ${{ steps.resolve.outputs.build_number }}
          ED_SIG: ${{ steps.sparkle_sign.outputs.ed_signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          zsh scripts/update-appcast.sh "$VERSION" "$BUILD_NUMBER" "$ED_SIG" "$LENGTH"
          cat appcast.xml

      - name: Update appcast.xml via PR
        if: steps.sparkle_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/appcast-v${VERSION}"
          cp appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "chore: update appcast.xml for v${VERSION} [skip release]"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update appcast.xml for v${VERSION} [skip release]" \
            --body "Automated appcast.xml update from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Create GitHub Release
        if: steps.gate.outputs.do_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo '')"
          gh release create "$TAG" \
            --title "Atoll $TAG" \
            --generate-notes \
            --notes-start-tag "$prev_tag" \
            --latest \
            "output/package/Atoll.dmg#Atoll.dmg (macOS, Universal)" \
            "output/package/Atoll.zip#Atoll.zip (macOS, Universal)"

      - name: Append install instructions to release notes
        if: steps.gate.outputs.do_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          HAVE_CERT: ${{ steps.signing.outputs.have_cert }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --json body -q .body)"
          if [[ "$NOTARIZED" == "true" ]]; then
            install_note="> This build is signed and notarized by Apple. It will launch without Gatekeeper warnings."
          elif [[ "$HAVE_CERT" == "true" ]]; then
            install_note="> This build is signed with a Developer ID certificate. On first launch, right-click then Open to bypass Gatekeeper."
          else
            install_note="> This build is unsigned. On first launch, right-click then Open, then confirm in System Settings then Privacy and Security to bypass Gatekeeper."
          fi
          gh release edit "$TAG" --notes "$(cat <<EOF
          ${existing}

          ---

          ## Installation

          1. Download Atoll.dmg, open it, and drag Atoll to Applications.
          2. Requires macOS 14+ (Apple Silicon and Intel).

          ${install_note}
          EOF
          )"

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.have_cert == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
