<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ocean" x1="100" y1="88" x2="924" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="0.5" stop-color="#162232"/>
      <stop offset="1" stop-color="#263347"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="88" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.10"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fab387" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle face with ocean gradient + top gloss -->
  <rect x="100" y="88" width="824" height="824" rx="197" fill="url(#ocean)"/>
  <rect x="100" y="88" width="824" height="412" rx="197" fill="url(#gloss)"/>

  <!-- Moon glow + disc, upper-right -->
  <circle cx="693" cy="269" r="206" fill="url(#moonglow)"/>
  <circle cx="693" cy="269" r="74" fill="#f9e2af"/>

  <!-- Atoll: sand ring + sapphire lagoon + teal center -->
  <ellipse cx="512" cy="734" rx="255" ry="76" fill="#cc8867"/>
  <ellipse cx="512" cy="730" rx="255" ry="76" fill="#fab387"/>
  <ellipse cx="512" cy="730" rx="206" ry="51" fill="#74c7ec"/>
  <ellipse cx="512" cy="730" rx="148" ry="32" fill="#94e2d5"/>

  <!-- Coconut palm: curved trunk + 5 fronds + 2 coconuts -->
  <path d="M 479 738 Q 610 541 528 318"
        stroke="#8b6f4e" stroke-width="18" stroke-linecap="round" fill="none"/>
  <g stroke="#a6e3a1" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 528 318 Q 347 236 322 244"/>
    <path d="M 528 318 Q 396 170 388 137"/>
    <path d="M 528 318 Q 512 137 503 104"/>
    <path d="M 528 318 Q 643 170 685 145"/>
    <path d="M 528 318 Q 693 252 726 261"/>
  </g>
  <circle cx="507" cy="322" r="14" fill="#3a2818"/>
  <circle cx="546" cy="320" r="14" fill="#3a2818"/>
</svg>
